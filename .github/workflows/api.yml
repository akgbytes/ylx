name: API CI/CD

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"

  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/api

jobs:
  ci:
    name: Check, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build API
        run: go build -o /tmp/ylx-api ./cmd/api

  deploy:
    name: Build and upload release
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Build Linux release
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o dist/ylx-api ./cmd/api

      - name: Create release checksum
        run: |
          cd dist
          sha256sum ylx-api > ylx-api.sha256

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::541872890107:role/ylx-github-deploy-role
          aws-region: ap-south-1
          role-session-name: ylx-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Upload release to S3
        run: |
          aws s3 cp dist/ \
            "s3://ylx-deployments-ap-south-1/releases/${GITHUB_SHA}/" \
            --recursive \
            --sse AES256

      - name: Deploy release through SSM
        env:
          INSTANCE_ID: i-0cb83dca50a8754d0
        run: |
          PARAMETERS=$(jq -nc --arg sha "$GITHUB_SHA" '{
            commands: [
              "set -euo pipefail",
              ("release_dir=/tmp/ylx-" + $sha),
              "install -d -m 0755 \"$release_dir\"",
              ("aws s3 cp \"s3://ylx-deployments-ap-south-1/releases/" + $sha + "/ylx-api\" \"$release_dir/ylx-api\""),
              ("aws s3 cp \"s3://ylx-deployments-ap-south-1/releases/" + $sha + "/ylx-api.sha256\" \"$release_dir/ylx-api.sha256\""),
              "cd \"$release_dir\"",
              "sha256sum -c ylx-api.sha256",
              "cp -a /opt/ylx/bin/ylx-api /opt/ylx/bin/ylx-api.previous",
              "install -o root -g root -m 0755 ylx-api /opt/ylx/bin/ylx-api.new",
              "mv -f /opt/ylx/bin/ylx-api.new /opt/ylx/bin/ylx-api",
              "if systemctl restart ylx-api && systemctl is-active --quiet ylx-api && curl --retry 5 --retry-delay 1 --retry-connrefused --fail --silent --show-error http://127.0.0.1:8080/healthz; then rm -f \"$release_dir/ylx-api\" \"$release_dir/ylx-api.sha256\"; rmdir \"$release_dir\"; else mv -f /opt/ylx/bin/ylx-api.previous /opt/ylx/bin/ylx-api; systemctl restart ylx-api; exit 1; fi"
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy YLX API ${GITHUB_SHA}" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"
          sleep 2

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

      - name: Verify public health endpoint
        working-directory: .
        run: |
          curl --retry 5 \
            --retry-delay 2 \
            --fail \
            --silent \
            --show-error \
            https://ylx-api.akgbytes.in/healthz
