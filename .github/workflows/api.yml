name: API CI/CD

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"

  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/api

jobs:
  ci:
    name: Check, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build API
        run: go build -o /tmp/ylx-api ./cmd/api

  deploy:
    name: Build and upload release
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Build Linux release
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o dist/ylx-api ./cmd/api

      - name: Create release checksum
        run: |
          cd dist
          sha256sum ylx-api > ylx-api.sha256

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::541872890107:role/ylx-github-deploy-role
          aws-region: ap-south-1
          role-session-name: ylx-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Upload release to S3
        run: |
          aws s3 cp dist/ \
            "s3://ylx-deployments-ap-south-1/releases/${GITHUB_SHA}/" \
            --recursive \
            --sse AES256
